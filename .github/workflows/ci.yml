name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        extras: ["dev"]
        include:
          # zstd before 3.14 comes from the optional backport; the other jobs cover zstd built
          # in (3.14) and no zstd at all (3.11 to 3.13).
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "dev,zstd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest --cov --cov-report=term --cov-report=xml

  # superscrubber104 crosses its own airlock: packed by itself, installed with no network,
  # verified by the copy it installed (examples/self-transfer/README.md).
  self-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ubuntu's AppArmor stops unprivileged user namespaces, which unshare -rn needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash examples/self-transfer/self-transfer.sh "$RUNNER_TEMP/self-transfer"
        env:
          REQUIRE_NO_NETWORK: "1"
