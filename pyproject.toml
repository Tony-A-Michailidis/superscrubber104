[build-system]
requires = ["hatchling==1.33.0"]  # exact: releases are rebuilt byte for byte (RELEASING.md)
build-backend = "hatchling.build"

[project]
name = "superscrubber104"
dynamic = ["version"]
description = "Prepare, inspect, sign and verify AI project deliveries for transfer across an air gap, with control-mapped evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Packaging",
    "Typing :: Typed",
]
# Keep this list short: the tool must cross its own airlock as a wheels bundle.
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML",
]
# zstd archives (Zarf packages, Hauler hauls) before Python 3.14, which has it built in.
zstd = ["backports.zstd>=1.0; python_version < '3.14'"]

[project.scripts]
superscrubber104 = "superscrubber104.cli:main"

[tool.hatch.version]
path = "src/superscrubber104/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/superscrubber104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["superscrubber104"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]  # design docs hold illustrative sketches, not code

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit
    "SIM",          # simplify
    "PTH",          # use pathlib
    "RUF",
    "TID",          # banned imports
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; seeded shuffles are not crypto; fixture literals (bytes, JSON) run long
"tests/**" = ["S101", "S311", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Never execute what we inspect, and never phone home.
"pickle.load".msg = "Never unpickle inspected content; use the static opcode scanner."
"pickle.loads".msg = "Never unpickle inspected content; use the static opcode scanner."
"urllib.request".msg = "No network calls at runtime."
"http.client".msg = "No network calls at runtime."
"requests".msg = "No network calls at runtime."
"httpx".msg = "No network calls at runtime."

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Tests dig into free-form JSON records (unit attributes, finding details) by key.
module = "tests.*"
disable_error_code = ["index", "call-overload", "union-attr", "operator"]
